[package]
name = "staticzero-tools"
version = "0.5.0"
license = "MIT"
edition = "2021"
description = "SDR integration, modem firmware analysis, and lab automation tools for StaticZero"

[lib]
name = "staticzero_tools"
path = "src/lib.rs"

[[bin]]
name = "sdr-bridge"
path = "src/sdr_integration.rs"

[[bin]]
name = "modem-firmware"
path = "src/modem_firmware.rs"

[[bin]]
name = "protocol-correlator"
path = "src/protocol_correlator.rs"

[[bin]]
name = "osnma-verify"
path = "src/osnma_verify.rs"

[[bin]]
name = "d2c-monitor"
path = "src/d2c_monitor.rs"

[[bin]]
name = "mlo-analyzer"
path = "src/mlo_analyzer.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
