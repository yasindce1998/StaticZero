name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check & Clippy (userspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check defense crate
        run: cargo check -p staticzero-defense --all-targets
      - name: Check common crate
        run: cargo check -p staticzero-common --features user --all-targets
      - name: Check tools crate
        run: cargo check -p staticzero-tools --all-targets
      - name: Check offense crate
        run: cargo check -p staticzero-offense --all-targets
      - name: Clippy defense
        run: cargo clippy -p staticzero-defense --all-targets -- -D warnings
      - name: Clippy common
        run: cargo clippy -p staticzero-common --features user --all-targets -- -D warnings
      - name: Clippy tools
        run: cargo clippy -p staticzero-tools --all-targets -- -D warnings
      - name: Clippy offense
        run: cargo clippy -p staticzero-offense --all-targets -- -D warnings

  ebpf:
    name: Build eBPF objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bpf-linker 0.13 builds against LLVM 23 (llvm-sys 231); Ubuntu stock
      # repos only carry older LLVM, so pull 23 from the official apt repo.
      - name: Install LLVM 23 (bpf-linker dependency)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y llvm-23-dev libpolly-23-dev clang-23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy
      - name: Install bpf-linker
        env:
          LLVM_PREFIX: /usr/lib/llvm-23
        run: cargo install bpf-linker --locked
      - uses: Swatinem/rust-cache@v2
      - name: Build eBPF programs (offense + defense)
        run: cargo xtask build-ebpf --release
      - name: Clippy eBPF programs
        run: |
          cargo +nightly clippy -p staticzero-offense-ebpf --target bpfel-unknown-none -Z build-std=core -- -D warnings
          cargo +nightly clippy -p staticzero-defense-ebpf --target bpfel-unknown-none -Z build-std=core -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  deny:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
