[package]
name = "staticzero-tools"
version = "0.7.0"
license = "MIT"
edition = "2021"
description = "SDR integration, modem firmware analysis, and lab automation tools for StaticZero"

[lib]
name = "staticzero_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Real SDR hardware support via SoapySDR (HackRF, bladeRF, USRP, RTL-SDR,
# LimeSDR through their vendor modules). Requires libSoapySDR at build and
# run time (libsoapysdr-dev on Debian/Ubuntu, soapysdr on Arch). Release
# binaries ship without it; build from source for real hardware.
soapy = []
