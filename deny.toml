[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
# Note: copyleft licenses are rejected implicitly — anything not in this
# allow-list is denied (the old `copyleft`/`unlicensed`/`deny` keys were
# removed in cargo-deny 0.17+).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
